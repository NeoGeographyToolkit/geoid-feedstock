{% set name = "geoid" %}
{% set version = "asp3.6.0" %}
{% set sha256 = "0ae08cb83f042d0ee078fb4ec0f895fe99c6b4b026fae72fa531d9b98186ba6d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: geoids.tgz
  url: https://github.com/NeoGeographyToolkit/StereoPipeline/releases/download/geoid2.0/geoids.tgz
  sha256: {{ sha256 }}

build:
  number: 1
  skip: True  # [win]

requirements:
  build:

  host:
   # Putting the compilers in the host section ensures compatibility with ISIS
    - c-compiler                1.9.0
    - compilers                 1.9.0
    - cxx-compiler              1.9.0
    - fortran-compiler          1.9.0
    - llvm-openmp               20.1.3
    - libgfortran5              14.2.0
  run:
 
    - llvm-openmp               20.1.3
    - libgfortran5              14.2.0

test:
  commands:

about:
  home: https://github.com/NeoGeographyToolkit/StereoPipeline
  license: APACHE II
  summary: 'Library to support geoids in the NASA Ames Stereo Pipeline'
  doc_url:
  dev_url:

extra:
  recipe-maintainers:
    - oleg-alexandrov

